name: Java CI/CD EcoMove avec SonarQube via Ngrok

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecomove
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Configuration du JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilation et Tests
      run: ./mvnw clean verify
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ecomove
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root

    # CORRECTION : Utilisation de guillemets pour les secrets et suppression du '>' pour une ligne plus propre
    - name: Analyse SonarQube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        ./mvnw sonar:sonar \
        -Dsonar.projectKey=EcoMove \
        -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
        -Dsonar.login="${{ secrets.SONAR_TOKEN }}" \
        -Dsonar.qualitygate.wait=true

    - name: Sauvegarde de l'Artifact (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: ecomove-app
        path: target/*.jar

    - name: Connexion Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build et Push de l'image Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ecomove:latest
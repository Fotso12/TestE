name: Java CI/CD EcoMove avec SonarQube via Ngrok

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Configuration du JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilation et Tests
      run: ./mvnw clean verify
      # On suppose que MySQL est déjà lancé localement ou via Docker sur le PC

    - name: Analyse SonarQube
      run: |
        ./mvnw sonar:sonar "-Dsonar.projectKey=EcoMove" "-Dsonar.host.url=http://localhost:9000" "-Dsonar.token=${{ secrets.SONAR_TOKEN }}" "-Dsonar.qualitygate.wait=true"

    - name: Sauvegarde de l'Artifact (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: ecomove-app
        path: target/*.jar

    - name: Connexion Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build et Push de l'image Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ecomove:latest
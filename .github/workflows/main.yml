name: Java CI/CD with Maven and MySQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # On lance un conteneur MySQL pour les tests
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecomove
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Run Tests
      run: ./mvnw clean install
      env:
        # On injecte les secrets dans les variables d'environnement de Spring Boot
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ecomove
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ecomove-app
        path: target/*.jar
